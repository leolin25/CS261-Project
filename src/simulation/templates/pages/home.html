{% extends 'pages/base.html' %}
{% load static %}

{% block content %}
    <div class="container">
    <div class="config-container">
        <h2>Airport Simulation Configuration</h2>
        <p>Please define the airport parameters below to begin a new traffic management simulation.</p>
        
        <form action="{% url 'results' %}" method="POST" id="config-form">
            {% csrf_token %}
            
            <div class="form-section">
                <h3>Flow Parameters</h3>
                <div class="form-group">
                    <label for="inbound_flow">Inbound Flights (per hour):</label>
                    <input type="number" id="inbound_flow" name="inbound_flow" min="0" required placeholder="e.g., 15">
                </div>
                <div class="form-group">
                    <label for="outbound_flow">Outbound Flights (per hour):</label>
                    <input type="number" id="outbound_flow" name="outbound_flow" min="0" required placeholder="e.g., 15">
                </div>
            </div>

            <div class="form-section">
                <h3>Runway Configuration</h3>
                <div class="form-group">
                    <label for="num_runways">Available Runways (1-10):</label>
                    <input type="number" id="num_runways" name="num_runways" min="1" max="10" required placeholder="e.g., 2">
                </div>
                
                <div class="form-group">
                    <label for="runway_mode">Default Operating Mode:</label>
                    <select id="runway_mode" name="runway_mode" required>
                        <option value="landing">Landing Only</option>
                        <option value="takeoff">Take-Off Only</option>
                        <option value="mixed" selected>Mixed Mode</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="runway_status">Default Operational Status:</label>
                    <select id="runway_status" name="runway_status" required>
                        <option value="available" selected>Available</option>
                        <option value="inspection">Runway Inspection</option>
                        <option value="snow">Snow Clearance</option>
                        <option value="equipment_failure">Equipment Failure</option>
                    </select>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="random_events" name="random_events">
                    <label for="random_events">Enable Random Events (Mechanical failures, inspections)</label>
                </div>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <button type="submit" class="btn-submit">Start New Simulation</button>
        </form>
    </div>

    <script src="{% static 'js/validation.js' %}"></script>
</div>

{% endblock %}
